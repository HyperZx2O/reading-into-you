    <meta name="twitter:title" content="Reading Into You" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f0f0f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c9a84c' stroke-width='2'/%3E%3C/svg%3E"

      rel="stylesheet"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>
    <div id="root">
      <!-- Minimal loading state: replaced by React on mount -->
      <div style="display:flex;align-items:center;justify-content:center;height:100dvh;background:#0f0f0f">
        <div style="width:24px;height:24px;border:2px solid rgba(201,168,76,0.2);border-top-color:#c9a84c;border-radius:50%;animation:spin 0.8s linear infinite"></div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
